<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor Inteligente de Enchentes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#07111f;color:#fff}
header{background:linear-gradient(90deg,#0f4c81,#0ea5e9);padding:24px}
header h1{margin:0}.sub{opacity:.9}
.container{max-width:1300px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#13263d;border-radius:18px;padding:20px;box-shadow:0 8px 18px rgba(0,0,0,.35);transition:.25s}
.card:hover{transform:translateY(-4px)}
.value{font-size:2rem;font-weight:bold}
#riskCard{text-align:center;padding:30px;font-size:2rem;font-weight:bold}
.buttons button{padding:12px 18px;margin:6px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.blue{background:#2563eb;color:#fff}
footer{text-align:center;color:#9fb3c8;padding:25px}
</style></head>
<body>
<header><h1>🌊 Monitor Inteligente de Enchentes</h1><div class=sub>ESP32 • Firebase • Open‑Meteo</div></header>
<div class=container>
<div class=grid>
<div class=card><h3>🌡 Temperatura</h3><div id=temp class=value>--</div></div>
<div class=card><h3>💧 Umidade</h3><div id=hum class=value>--</div></div>
<div class=card><h3>🌧 Chuva Prevista</h3><div id=chuva class=value>--</div></div>
<div class=card><h3>📈 IRE</h3><div id=ire class=value>--</div></div>
</div>
<div class="card" id="riskCard"><div>⚠️ RISCO</div><div id=risco>--</div></div>
<div class=grid>
<div class=card><h3>🤖 Modo Automático</h3><div id=modoAuto class=value>--</div>
<div class=buttons><button class=blue onclick=autoOn()>AUTO ON</button><button class=red onclick=autoOff()>AUTO OFF</button></div></div>
<div class=card><h3>🔌 Relé</h3><div id=estadoRele class=value>--</div>
<div class=buttons><button class=green onclick=ligarRele()>Ligar</button><button class=red onclick=desligarRele()>Desligar</button></div></div>
</div>
</div>
<footer>Atualização em tempo real</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey: "AIzaSyAC5BprHfoHEoe1AfLYv4h98eod01sf52U",
authDomain:"monitor-enchentes.firebaseapp.com",
databaseURL:"https://monitor-enchentes-default-rtdb.firebaseio.com",
projectId:"monitor-enchentes",
storageBucket:"monitor-enchentes.firebasestorage.app",
messagingSenderId:"579140784094",
appId: "1:579140784094:web:8369295db1d090d7bfd74f"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

window.ligarRele=()=>set(ref(db,"controle/rele"),true);
window.desligarRele=()=>set(ref(db,"controle/rele"),false);
window.autoOn=()=>set(ref(db,"controle/automatico"),true);
window.autoOff=()=>set(ref(db,"controle/automatico"),false);

onValue(ref(db,"dados"),s=>{
 const d=s.val(); if(!d)return;
 temp.innerHTML=d.temperatura+" °C";
 hum.innerHTML=d.umidade+" %";
 chuva.innerHTML=d.chuvaPrevista+" mm";
 ire.innerHTML=d.ire;
 estadoRele.innerHTML=d.estadoRele;
 risco.innerHTML=d.risco;
 const cores={BAIXO:"#22c55e",MODERADO:"#eab308",ALTO:"#f97316",CRITICO:"#ef4444"};
 risco.style.background=cores[d.risco]||"#666";
});
onValue(ref(db,"controle"),s=>{
 const c=s.val(); if(!c)return;
 modoAuto.innerHTML=c.automatico?"ON":"OFF";
});
</script>
</body></html>
